<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Duarte Santos: maintainer of openGym, apprentice developer at Sunrise, self-hosts everything">
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .type{animation:type 1.6s steps(22) .3s both}
  @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .caret{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .rise{opacity:0;animation:rise .7s ease-out forwards}
  .d1{animation-delay:1.9s}.d2{animation-delay:2.3s}.d3{animation-delay:2.7s}.d4{animation-delay:3.1s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .bar{animation:rep 2.4s cubic-bezier(.45,0,.25,1) 3.2s infinite}
  @keyframes rep{0%,100%{transform:translateY(0)}45%,55%{transform:translateY(-62px)}}
  .ecg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 4s linear 1s infinite}
  @keyframes draw{to{stroke-dashoffset:-1400}}
  .r{opacity:0;animation:cnt 7.2s step-end 3.2s infinite}
  .r2{animation-delay:5.6s}.r3{animation-delay:8s}
  @keyframes cnt{0%{opacity:1}33.3%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;clip-path:none!important;stroke-dashoffset:0!important}.r2,.r3{opacity:0!important}}
</style>
<rect width="1200" height="330" rx="18" fill="#f6f7f9"/>
<rect x="16" y="16" width="1168" height="298" rx="14" fill="#ffffff" stroke="#e3e5e9"/>
<!-- window chrome -->
<circle cx="44" cy="42" r="6" fill="#ff5f57"/><circle cx="64" cy="42" r="6" fill="#febc2e"/><circle cx="84" cy="42" r="6" fill="#28c840"/>
<text x="600" y="47" text-anchor="middle" class="mono" font-size="13" fill="#5d636d">duarte@homelab: ~</text>
<line x1="16" y1="66" x2="1184" y2="66" stroke="#e3e5e9"/>

<!-- prompt -->
<g class="mono" font-size="20">
  <text x="52" y="110" fill="#1fa83a">$</text>
  <text x="74" y="110" fill="#111317" class="type">whoami --verbose</text>
</g>

<text x="50" y="170" class="sans rise d1" font-size="52" font-weight="800" fill="#111317" letter-spacing="-1">Duarte Santos</text>
<text x="52" y="210" class="sans rise d2" font-size="21" fill="#5d636d">maintainer of <tspan fill="#1fa83a" font-weight="700">openGym</tspan> · apprentice dev @ Sunrise · self-hosts everything</text>
<g class="mono rise d3" font-size="15" fill="#5d636d">
  <text x="52" y="248"><tspan fill="#1fa83a">›</tspan> 🇨🇭 Zurich  <tspan fill="#1fa83a">›</tspan> React · Node · Capacitor · Docker  <tspan fill="#1fa83a">›</tspan> ships every 2 weeks</text>
</g>
<g class="mono rise d4" font-size="20">
  <text x="52" y="248" dy="36" fill="#1fa83a">$ <tspan class="caret">▍</tspan></text>
</g>

<!-- barbell doing reps -->
<g transform="translate(985 215)">
  <line x1="-120" y1="38" x2="120" y2="38" stroke="#e3e5e9" stroke-width="2"/>
  <g class="bar">
    <rect x="-112" y="-4" width="224" height="8" rx="4" fill="#5d636d"/>
    <rect x="-98" y="-34" width="18" height="68" rx="4" fill="#1fa83a"/>
    <rect x="-78" y="-24" width="12" height="48" rx="3" fill="#d9dce1"/>
    <rect x="80" y="-34" width="18" height="68" rx="4" fill="#1fa83a"/>
    <rect x="66" y="-24" width="12" height="48" rx="3" fill="#d9dce1"/>
  </g>
  <g class="mono" font-size="14" text-anchor="middle" fill="#5d636d">
    <text y="68" class="r">rep 1 / 3</text>
    <text y="68" class="r r2">rep 2 / 3</text>
    <text y="68" class="r r3">rep 3 / 3 ✓</text>
  </g>
</g>

<!-- heartbeat -->
<g transform="translate(40 290)" opacity=".5">
  <path d="M0 40 H250 l12 -4 l10 4 h18 l8 -30 l10 56 l9 -34 l6 8 h40 l14 -6 l12 6 H640 l12 -4 l10 4 h18 l8 -30 l10 56 l9 -34 l6 8 h40 l14 -6 l12 6 H760" fill="none" stroke="#1fa83a" stroke-width="2" stroke-linejoin="round" class="ecg" transform="scale(1 .35)"/>
</g>
</svg>
